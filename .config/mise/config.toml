# Mise configuration for the moonrockz/smithy monorepo.
#
# Tools are pinned here. Tasks are MoonBit scripts in scripts/*.mbtx, run with moonx, so one script
# works on every platform (see AGENTS.md, "Task scripts").
#
# Local overrides go in .config/mise/config.local.toml (gitignored); see config.local.toml.example.

[tools]
# Node.js runs the js target in `moon test --target js` and `moon run --target js`.
node = "24.14.1"

# YAML linting, pinned so lint results do not change between machines
yamllint = "1.38.0"

# Git hooks manager; the hooks are in lefthook.yml
lefthook = "2.1.1"

# Python projects of the JSON-RPC runtime and the generated Python peers. uv installs the Python
# version that each project pins, and the locked dependencies, only when a Python task runs.
uv = "0.13.5"

# C cross compiler for the published zig-cross tool (Linux and macOS release binaries)
zig = "0.17.0"

# Changelog generator for the release notes
"aqua:orhun/git-cliff" = "2.14.2"

# MoonBit toolchain, pinned. mise cannot resolve "latest" for an http: tool, and a pinned version
# keeps CI and every machine on the same compiler. To move to a newer release, change the version
# here and in each URL (with "+" written as "%2B"), taken from
# https://cli.moonbitlang.com/binaries/<version>/.
#
# The binary archive omits the core library. CI (and a fresh machine) completes it with
# `curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$(mise where http:moonbit) bash -s -- <version>`.

[tools."http:moonbit"]
version = "0.10.15+943464bfa"
bin_path = "bin"

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-linux-x86_64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-windows-x86_64.zip", format = "zip" }

[env]
_.path = ["./node_modules/.bin"]

# Every task is a MoonBit script: `moonx scripts/<name>.mbtx`. Pass arguments after `--`.

[tasks.build]
description = "Build all workspace members (args: targets, --release; default: wasm wasm-gc js native)"
run = "moonx scripts/build.mbtx"

[tasks."build:wasm"]
description = "Build all workspace members for the wasm target"
run = "moonx scripts/build.mbtx wasm"

[tasks."build:wasm-gc"]
description = "Build all workspace members for the wasm-gc target"
run = "moonx scripts/build.mbtx wasm-gc"

[tasks."build:js"]
description = "Build all workspace members for the js target"
run = "moonx scripts/build.mbtx js"

[tasks."build:native"]
description = "Build all workspace members as native release executables"
run = "moonx scripts/build.mbtx native --release"

[tasks."build:cross"]
description = "Cross-compile native binaries with zig (args: build targets, then -- and package paths)"
run = "moonx scripts/zig-cross.mbtx build"

[tasks.test]
description = "Run tests for all workspace members (args: targets; default: wasm wasm-gc js native)"
run = "moonx scripts/test.mbtx"

[tasks.format]
description = "Format MoonBit code"
run = "moonx scripts/format.mbtx"

[tasks.lint]
description = "Run all lint tasks (YAML, MoonBit format and check)"
run = "moonx scripts/lint.mbtx"

[tasks."lint:moonbit"]
description = "Check MoonBit formatting and run moon check"
run = "moonx scripts/lint-moonbit.mbtx"

[tasks."lint:yaml"]
description = "Lint YAML files with yamllint"
run = "moonx scripts/lint-yaml.mbtx"

[tasks.validate]
description = "Run all validation checks"
depends = ["validate:packages", "validate:versions", "regex:vendor:check", "runtime:embed:check", "jsonrpc:go:runtime:check"]

[tasks."validate:packages"]
description = "Verify the workspace package structure against moon.work"
run = "moonx scripts/validate-packages.mbtx"

[tasks."validate:versions"]
description = "Verify that every module and version string has the version of the root moon.mod"
run = "moonx scripts/versions.mbtx check"

[tasks."build:release"]
description = "Build the release outputs (4 cross-built native binaries, 2 wasm files) and pack them into dist/. Pack needs the windows-x64 binary from build:windows"
run = "moonx scripts/dist.mbtx"

[tasks."build:windows"]
description = "Build the windows-x64 binary natively (Windows host only)"
run = "moonx scripts/dist.mbtx build-windows"

[tasks."release:assets"]
description = "Pack the built release outputs into dist/ (archives, wasm files, checksums.txt)"
run = "moonx scripts/dist.mbtx pack"

[tasks."tck:vendor"]
description = "Vendor the Java reference's loader test corpus into tests/tck, the compatibility kit (args: git ref)"
run = "moonx scripts/vendor-tck.mbtx"

[tasks."tck:reference"]
description = "Regenerate Java reference build and validation expectations"
run = "moonx scripts/reference-build.mbtx"

[tasks."tck:vendor:openapi"]
description = "Vendor hash-verified OpenAPI reference fixtures (args: upstream source directory)"
run = "moonx scripts/vendor-openapi.mbtx"

[tasks."tck:vendor:diff"]
description = "Vendor hash-verified model diff fixtures from the pinned Java source snapshot"
run = "moonx scripts/vendor-diff.mbtx"

[tasks."tck:reference:diff"]
description = "Verify model diff cases with the pinned Java implementation (requires a JDK; optional --check)"
run = "moonx scripts/reference-diff.mbtx"

[tasks."tck:reference:openapi"]
description = "Verify OpenAPI expectations against pinned Java sources (args: source directory, --check)"
run = "moonx scripts/reference-openapi.mbtx"

[tasks."reference:tour"]
description = "Write the Java reference results (events, JSON Schema and OpenAPI, with the smithy.rpc traits for a case that uses them) of the tour lesson cases (requires a JDK; args: smithy checkout, --check)"
run = "moonx scripts/reference-tour.mbtx"

[tasks."tour:vendor:morphir"]
description = "Vendor the pinned finos/morphir sources for the tour, hash-verified (args: checkout directory, default .dev/out/finos-morphir)"
run = "moonx scripts/vendor-morphir.mbtx"

[tasks."morphir:codecs:vendor"]
description = "Vendor the pinned Morphir v3/v4 codec conformance authorities into examples/morphir-codecs, hash-verified (args: --morphir DIR, --morphir-elm DIR; --check verifies offline, --check --remote also against the pinned trees)"
run = "moonx scripts/vendor-morphir-codecs.mbtx"

[tasks."tour:check"]
description = "Check the tour lessons against the playground core and the committed Java reference results, and the pinned Morphir examples against the case study model (no bun, Java or browser)"
run = "moon -C site test --target native -p moonrockz/smithy-site/tour/check -p moonrockz/smithy-site/tour/morphir"

[tasks."test:native-zig"]
description = "Run the native tests with zig as the C compiler (the host wrapper of zig-cross)"
run = "moonx scripts/zig-cross.mbtx exec host -- moonx scripts/test.mbtx native"

[tasks."tck:vendor:json"]
description = "Vendor the Java reference's JSON AST corpus (args: git ref)"
run = "moonx scripts/vendor-tck.mbtx --json"

[tasks."prelude:vendor"]
description = "Vendor and embed the official Smithy prelude and contract traits (args: git ref)"
run = "moonx scripts/vendor-prelude.mbtx"

[tasks."jmespath:vendor"]
description = "Vendor and embed the official JMESPath compliance tests (args: git ref)"
run = "moonx scripts/vendor-jmespath.mbtx"

[tasks."regex:vendor:check"]
description = "Check the regex engine that smithy-validation copies from core against the core of the pinned toolchain (args: --diff, a core directory)"
run = "moonx scripts/regex-vendor-check.mbtx"

[tasks."test:scripts"]
description = "Run the tests of the task scripts (scripts/*.mbtx that have a scripts/features/*.feature)"
run = "moonx scripts/test-scripts.mbtx"

[tasks."bench:validate"]
description = "Time smithy validate on generated models and fail over the bounds (args: --sizes, --max-seconds, --max-ratio, --cutoff, --no-build)"
run = "moonx scripts/bench-validate.mbtx"

[tasks."test:bdd"]
description = "Run the moonspec acceptance features (tests/bdd, js target)"
run = "moon test tests/bdd --target js"

[tasks."test:openrpc"]
description = "Qualify OpenRPC artifacts, official schemas, runtime contracts and isolated consumers"
run = "moonx scripts/test-openrpc.mbtx"

[tasks.check]
description = "Run lint, validate, test and build"
run = "moonx scripts/check.mbtx"

[tasks.clean]
description = "Remove build artifacts"
run = "moonx scripts/clean.mbtx"

[tasks."hooks:install"]
description = "Install the git hooks with lefthook (see lefthook.yml)"
run = "moonx scripts/hooks-install.mbtx"

[tasks.list-tasks]
description = "List all mise tasks"
run = "mise tasks"

[settings]
experimental = true

[tasks."release:version"]
description = "Print the next release version, computed by git-cliff from the commits"
run = "moonx scripts/release.mbtx version"

[tasks."release:prepare"]
description = "Open the release pull request (args: optional X.Y.Z, --local to stop before the push)"
run = "moonx scripts/release.mbtx prepare"

[tasks."release:refresh"]
description = "Update the body of the release pull request from CHANGELOG.md and mark it ready"
run = "moonx scripts/release.mbtx refresh"

[tasks."release:notes"]
description = "Print the GitHub release notes of a version (args: X.Y.Z)"
run = "moonx scripts/release.mbtx notes"

[tasks."release:plan"]
description = "Decide what the Release workflow does (reads GITHUB_EVENT_NAME, GITHUB_REF_TYPE, GITHUB_REF_NAME, DRY_RUN; writes GITHUB_OUTPUT)"
run = "moonx scripts/release.mbtx plan"

[tasks."smoke:fingerprint"]
description = "Print the fingerprint of the smoke inputs at HEAD and the version (writes GITHUB_OUTPUT)"
run = "moonx scripts/smoke.mbtx fingerprint"

[tasks."smoke:inputs"]
description = "List the files at HEAD that are inputs of the smoke fingerprint"
run = "moonx scripts/smoke.mbtx inputs"

[tasks."smoke:record"]
description = "Write the smoke evidence for a dist/ that passed smoke (args: dist dir, out dir; needs FINGERPRINT; CI only)"
run = "moonx scripts/smoke.mbtx record"

[tasks."smoke:report"]
description = "File or update the smoke-breach issue for the failed smoke of this run; the same breach changes nothing (needs GH_TOKEN, FINGERPRINT, VERSION; CI only)"
run = "moonx scripts/smoke-breach.mbtx report"

[tasks."smoke:resolve"]
description = "Close the open smoke-breach issues after a passing smoke (needs GH_TOKEN; CI only)"
run = "moonx scripts/smoke-breach.mbtx resolve"

[tasks."release:github"]
description = "Create the GitHub release from dist/, or upload the assets it lacks (args: X.Y.Z; needs GITHUB_SHA and RUNNER_TEMP)"
run = "moonx scripts/release.mbtx github"

[tasks."release:status"]
description = "Check that main, the tags, the GitHub release and mooncakes.io agree"
run = "moonx scripts/release.mbtx status"

[tasks."release:credentials"]
description = "Write the mooncakes.io credentials from MOONCAKES_USER_TOKEN to ~/.moon/credentials.json (CI only)"
run = "moonx scripts/credentials.mbtx"

[tasks."release:publish"]
description = "Publish the public modules to mooncakes.io with retries; a version already published counts as done (CI only)"
run = "moonx scripts/publish.mbtx"

[tasks."test:cli"]
description = "Exercise CLI file I/O, pipes, diagnostics, formatting and conversion (args: targets)"
run = "moonx scripts/test-cli.mbtx"

[tasks."tck:vendor:protocols"]
description = "Vendor pinned Smithy protocol-test traits and fixtures from a source snapshot"
run = "moonx scripts/vendor-protocol-tests.mbtx"

[tasks."test:changelog"]
description = "Check that generated changelogs preserve wrapped migration text"
run = "moonx scripts/test-changelog.mbtx"

[tasks."release:verify-cli"]
description = "Run the published moonx CLI with bounded retries for registry asset availability (args: X.Y.Z)"
run = "moonx scripts/publish.mbtx verify-cli"

[tasks."test:resources"]
description = "Test the pinned resource consumer against a locally packaged module"
run = "moonx scripts/test-resource-consumer.mbtx"

[tasks."test:validation-consumer"]
description = "Compile and run an isolated packaged validation consumer on all targets"
run = "moonx scripts/test-validation-consumer.mbtx"

[tasks."test:ion-consumer"]
description = "Compile and run an isolated packaged Ion validation consumer on all targets"
run = "moonx scripts/test-validation-consumer.mbtx --ion"

[tasks."fixtures:npm"]
description = "Regenerate the local npm archive fixture without package hooks or network"
run = "moonx scripts/vendor-tar-fixtures.mbtx"

[tasks."test:http"]
description = "Test public archive acquisition and CLI builds against controlled loopback HTTP fixtures"
run = "moonx scripts/test-public-http.mbtx"

[tasks."site:build"]
description = "Build one version of the site: warren bundle and pre-rendered pages (args: --content --channel --site-root --release-version --ref --out)"
run = "moonx scripts/site-build.mbtx"

[tasks."site:dev"]
description = "Build the site at base / and serve it on http://localhost:8080"
run = "moonx scripts/site-dev.mbtx"

[tasks."site:check"]
description = "Test the site packages, build both channels as the Pages workflow does, and check their links"
run = "moonx scripts/site-check.mbtx"

[tasks."site:pages"]
description = "Build both channels as GitHub Pages serves them and check their links (args: --out)"
run = "moonx scripts/site-pages.mbtx"

[tasks."site:test:browser"]
description = "Run the browser tests of the site against _site, the output of site:pages (Lightpanda, and Chromium where README says)"
dir = "site"
run = "bun run test:browser"

[tasks."site:linkcheck"]
description = "Check links, routes and the search index of a built site (args: --dist --base --ignore)"
run = "moonx scripts/site-linkcheck.mbtx"

[tasks."site:latest-tag"]
description = "Print the newest stable release tag (prereleases ignored); prints nothing when there is none"
run = "moonx scripts/site-latest-tag.mbtx"
hide = true

[tasks."runtime:embed"]
description = "Copy the JSON-RPC runtime sources into the MoonBit and Python generators"
run = "moonx scripts/runtime-embed.mbtx write"

[tasks."runtime:embed:check"]
description = "Fail when a generator's embedded JSON-RPC runtime differs from runtimes/"
run = "moonx scripts/runtime-embed.mbtx check"

[tasks."test:runtime:moonbit"]
description = "Run the tests of the MoonBit JSON-RPC runtime (native)"
run = "moonx scripts/runtime-moonbit.mbtx test"

[tasks."test:runtime:python"]
description = "Run pytest, pyright --strict and ruff on the Python JSON-RPC runtime"
run = "moonx scripts/runtime-python.mbtx test"

[tasks."sample:build:moonbit"]
description = "Build the MoonBit payment terminal sample programs and write commands/moonbit.json"
run = "moonx scripts/runtime-moonbit.mbtx sample-build"

[tasks."sample:build:python"]
description = "Prepare the Python payment terminal sample programs and write commands/python.json"
run = "moonx scripts/runtime-python.mbtx sample-build"

[tasks."test:generated:moonbit"]
description = "Run moon check --deny-warn and the tests of the generated MoonBit peers (native)"
run = "moonx scripts/runtime-moonbit.mbtx generated"

[tasks."test:generated:python"]
description = "Run pyright --strict, ruff and pytest on the generated Python peers"
run = "moonx scripts/runtime-python.mbtx generated"

[tasks."codegen:payment-terminal"]
description = "Regenerate the golden generated peers of examples/payment-terminal (args: --check)"
run = "moonx scripts/codegen-payment-terminal.mbtx"

[tasks."test:payment-terminal"]
description = "Run the MoonBit POS against the Python terminal over stdio and check each transcript"
depends = ["sample:build:moonbit", "sample:build:python"]
run = "moonx scripts/payment-terminal.mbtx"
[tasks."jsonrpc:go:runtime"]
description = "Embed the Go runtime source in the Go generator (use --check to check drift)"
run = "moonx scripts/jsonrpc-go-runtime.mbtx"

[tasks."codegen:go"]
description = "Generate the payment Go golden files (use --check to check drift)"
run = "moonx scripts/jsonrpc-go-golden.mbtx"

[tasks."test:jsonrpc:go"]
description = "Run gofmt, build, vet and tests on the Go runtime, generated peers and handlers"
tools = { go = "1.27.3" }
run = "moonx scripts/test-jsonrpc-go.mbtx"

[tasks."test:jsonrpc:matrix"]
description = "Run and validate all 27 generated-peer language and transport combinations"
run = "moonx scripts/jsonrpc-matrix.mbtx"

[tasks."sample:build:go"]
description = "Build the Go payment POS and terminal once for sample runs"
tools = { go = "1.27.3" }
run = "moonx scripts/build-payment-go.mbtx"

[tasks."jsonrpc:go:runtime:check"]
description = "Check the embedded Go runtime against its tested source files"
run = "moonx scripts/jsonrpc-go-runtime.mbtx --check"
