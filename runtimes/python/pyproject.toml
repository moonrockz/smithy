[project]
name = "smithy-jsonrpc-runtime"
version = "0.0.0"
description = "The asyncio JSON-RPC 2.0 runtime that the Smithy Python generator copies into generated peers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "websockets==17.3",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.17.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
]

[tool.uv]
package = false

[tool.pyright]
include = ["smithy_jsonrpc_runtime", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "PL", "T20"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
