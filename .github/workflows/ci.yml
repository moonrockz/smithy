name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: mise run lint

      - name: Validate package structure
        run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }}
        run: mise run build -- ${{ matrix.target }} --release

      # Validation time must stay near linear in the shape count (smithy-2qe.43).
      # The bounds leave room for a shared runner; the local defaults are tighter.
      - name: Benchmark validation
        if: matrix.target == 'native'
        run: mise run bench:validate -- --no-build --max-seconds 8 --max-ratio 3 --cutoff 60

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test ${{ matrix.target }}
        if: matrix.target != 'js'
        run: mise run test -- ${{ matrix.target }}

      - name: Test JS and capture coverage
        if: matrix.target == 'js'
        run: mise run test:coverage

      - name: Upload workspace coverage
        if: always() && matrix.target == 'js'
        uses: actions/upload-artifact@v4
        with:
          name: moonbit-workspace-coverage
          path: .dev/out/coverage/report
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  release-build:
    name: Release artifacts
    needs: [lint]
    uses: ./.github/workflows/release-build.yml

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the native tests with zig as the C compiler
        run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the task script tests
        run: mise run test:scripts

      - name: Check the vendored Morphir codec authorities
        run: mise run morphir:codecs:vendor -- --check

      - name: Check the Morphir codec bundles through the CLI and build
        run: mise run test:morphir-codecs

  # The task runs `moon -C site`, not in site/: a moon shim in site/ would read the untrusted site/mise.toml
  # (bun, Lightpanda), and this job installs neither.
  tour:
    name: Check the tour lessons
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tour lessons
        run: mise run tour:check

  # The JSON-RPC generators of the payment terminal sample. The golden files, the runtimes, the
  # generated peers and the MoonBit POS against the Python terminal over stdio, with a check of each
  # recorded transcript. uv installs the pinned Python and the locked packages. The manual workflow
  # runs the full matrix of languages and transports.
  jsonrpc:
    name: JSON-RPC peers (MoonBit POS to Python terminal)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the golden generated peers are current
        run: mise run codegen:payment-terminal -- --check

      - name: Check the Go runtime embedding
        run: mise run jsonrpc:go:runtime -- --check

      - name: Check that the generated Go golden peers are current
        run: mise run codegen:go -- --check

      - name: Test the MoonBit runtime
        run: mise run test:runtime:moonbit

      - name: Test the Python runtime
        run: mise run test:runtime:python

      - name: Check and test the generated MoonBit peers
        run: mise run test:generated:moonbit

      - name: Check and test the generated Python peers
        run: mise run test:generated:python

      - name: Run the MoonBit POS against the Python terminal over stdio
        run: mise run test:payment-terminal

  # CI owns the PR preview and its dist artifact. The planner preserves the former
  # Release path selector, and main/manual smoke uses trusted fingerprint evidence.
  # PRs never record trusted evidence or file breach issues. A release always smokes
  # its own same-run bytes in Release, regardless of evidence.
  smoke-plan:
    name: Smoke evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      version: ${{ steps.fingerprint.outputs.version }}
      selected: ${{ steps.selection.outputs.smoke }}
      record: ${{ steps.selection.outputs.record }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fingerprint the smoke inputs
        id: fingerprint
        run: mise run smoke:fingerprint

      # Keep the path the same as in smoke.yml: the cache version includes it.
      - name: Look up the smoke evidence
        id: evidence
        uses: actions/cache/restore@v6
        with:
          path: .smoke-evidence
          key: smoke-evidence-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Select smoke for this event and change set
        id: selection
        env:
          EVIDENCE: ${{ steps.evidence.outputs.cache-hit }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: moonx scripts/ci-plan.mbtx plan

  smoke:
    name: Smoke
    needs: [smoke-plan, release-build]
    if: needs.smoke-plan.outputs.selected == 'true'
    uses: ./.github/workflows/smoke.yml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    with:
      version: ${{ needs.smoke-plan.outputs.version }}
      fingerprint: ${{ needs.smoke-plan.outputs.fingerprint }}
      record: ${{ needs.smoke-plan.outputs.record == 'true' }}
      breach-issues: ${{ github.ref == 'refs/heads/main' }}

  # The only check that branch protection needs. Add every new job to `needs`.
  # `if: always()` is required: without it this job is skipped when a needed job fails, and
  # GitHub counts a skipped required check as passed.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      [lint, build, test, release-build, test-native-zig, test-scripts, tour, jsonrpc, smoke-plan, smoke]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require every selected category to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          SMOKE_SELECTED: ${{ needs.smoke-plan.outputs.selected }}
        run: moonx scripts/ci-plan.mbtx gate
