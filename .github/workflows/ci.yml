name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: mise run lint

      - name: Validate package structure
        run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }}
        run: mise run build -- ${{ matrix.target }} --release

      # Validation time must stay near linear in the shape count (smithy-2qe.43).
      # The bounds leave room for a shared runner; the local defaults are tighter.
      - name: Benchmark validation
        if: matrix.target == 'native'
        run: mise run bench:validate -- --no-build --max-seconds 8 --max-ratio 3 --cutoff 60

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test ${{ matrix.target }}
        run: mise run test -- ${{ matrix.target }}

  build-windows:
    name: Build (windows-x64)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'

      - name: Update the registry
        run: moon update

      - name: Build smithy natively for Windows
        run: moon build apps/smithy --target native --release

      # Keep this version aligned with the Node pin in .config/mise/config.toml.
      - name: Install Node for Windows acquisition fixtures
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Test public and authenticated acquisition on Windows
        run: moonx scripts/test-public-http.mbtx native js

      - name: Test CLI behavior on Windows
        run: moonx scripts/test-cli.mbtx native js

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/native/release/build/moonrockz/smithy-cli/smithy-cli.exe
          if-no-files-found: error
          retention-days: 7

  cross-build:
    name: Cross-build release outputs
    runs-on: ubuntu-latest
    needs: [lint, build-windows]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the windows-x64 executable
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/cross/windows-x64/native/release/build/moonrockz/smithy-cli

      - name: Build the release outputs into dist/
        run: mise run build:release

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the native tests with zig as the C compiler
        run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the task script tests
        run: mise run test:scripts

  # Smoke after a merge: run the release binaries of cross-build on a runner of each OS. It runs
  # only on a push to main and a manual run, and only when no trusted run has smoked the same inputs
  # (scripts/smoke.mbtx). A change outside the inputs, such as docs or tests, carries the evidence
  # forward. Pull requests skip both jobs: the Release workflow smokes release-file changes, and a
  # release always smokes the bytes that it publishes. On main, a failed smoke files or updates the
  # `smoke-breach` issue, and a passing smoke closes it.
  smoke-plan:
    name: Smoke evidence
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      version: ${{ steps.fingerprint.outputs.version }}
      evidence: ${{ steps.evidence.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fingerprint the smoke inputs
        id: fingerprint
        run: mise run smoke:fingerprint

      # Keep the path the same as in smoke.yml: the cache version includes it.
      - name: Look up the smoke evidence
        id: evidence
        uses: actions/cache/restore@v6
        with:
          path: .smoke-evidence
          key: smoke-evidence-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Report the decision
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          EVIDENCE: ${{ steps.evidence.outputs.cache-hit }}
        run: |
          if [ "$EVIDENCE" = "true" ]; then
            echo "Evidence exists for smoke-evidence-$FINGERPRINT: smoke is skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No evidence for smoke-evidence-$FINGERPRINT: smoke runs." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    name: Smoke
    needs: [smoke-plan, cross-build]
    if: needs.smoke-plan.outputs.evidence != 'true'
    uses: ./.github/workflows/smoke.yml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    with:
      version: ${{ needs.smoke-plan.outputs.version }}
      fingerprint: ${{ needs.smoke-plan.outputs.fingerprint }}
      record: true
      breach-issues: ${{ github.ref == 'refs/heads/main' }}

  # The only check that branch protection needs. Add every new job to `needs`.
  # `if: always()` is required: without it this job is skipped when a needed job fails, and
  # GitHub counts a skipped required check as passed.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, build, build-windows, test, cross-build, test-native-zig, test-scripts, smoke-plan, smoke]
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
