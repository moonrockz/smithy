# Release: plan, validate, build-windows, build, smoke, publish, release.
#
# Windows is built on a Windows runner: a cross-built Windows binary reads its arguments wrongly.
#
# The flow:
#   plan      decides what this run does. It computes the fingerprint of the smoke inputs, looks up
#             the smoke evidence, and writes release, dry_run, version, tag, validate, build and record.
#   validate  runs the full checks and the version check.
#   build-windows  builds the windows-x64 executable natively and uploads it.
#   build     cross-builds the other binaries, adds the Windows one and packs dist/. It uploads dist/.
#   smoke     runs each binary on a real runner of its OS (.github/workflows/smoke.yml), and records
#             the evidence when `record` is true.
#   publish   publishes the modules to mooncakes.io. A module already published counts as done.
#   release   creates the GitHub release from the dist artifact, or uploads the missing assets.
#
# What each run does (scripts/release.mbtx, `checks`):
#   release (push to main or a tag)  validate, build, smoke, record, publish, release. A release always
#                                    smokes the bytes that it publishes, whatever the evidence says.
#   manual run with dry_run          validate, build, smoke, record. A full rehearsal.
#   pull request (release files)     build and smoke only when no trusted run smoked the same inputs.
#                                    CI owns validate. It records nothing: a pull request is not trusted.
#   schedule (nightly)               build, smoke and record only when no trusted run smoked the same
#                                    inputs. A failed smoke opens or updates the issue
#                                    "Smoke failed on main".
# Feature pull requests do not start this workflow. CI smokes after the merge to main instead.
#
# Re-run failed jobs: after a transient failure, use "Re-run failed jobs" on the run. GitHub runs
# again the failed job and the jobs after it. The jobs that passed keep their outputs and their
# artifacts, so the retry ships the same bytes that smoke checked. publish and release are
# idempotent, so a retry after a partial publish or a partial upload continues where it stopped.
# Release runs never overlap: they share one concurrency group. A pull request run and the scheduled
# run have their own groups, so they never hold back or cancel a pending release.
# The dist artifact is kept 30 days, the same as the GitHub re-run window.
# For a failure that is not transient, run `mise run release:status` first.

name: Release

on:
  push:
    branches: [main]
    paths: [moon.mod]
    tags: ['v*']
  # Only the release machinery. CI owns the sources.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/smoke.yml
      - .github/actions/setup/**
      - scripts/release.mbtx
      - scripts/publish.mbtx
      - scripts/dist.mbtx
      - scripts/versions.mbtx
      - scripts/credentials.mbtx
      - scripts/zig-cross.mbtx
      - scripts/smoke.mbtx
      - .config/mise/config.toml
      - moon.mod
      - CHANGELOG.md
  # Nightly verification of main. It builds and smokes only inputs that have no evidence.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and the build, but do not publish or create a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number)
    || github.event_name == 'schedule' && 'release-schedule' || 'release' }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      validate: ${{ steps.plan.outputs.validate }}
      build: ${{ steps.plan.outputs.build }}
      record: ${{ steps.plan.outputs.record }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fingerprint the smoke inputs
        id: fingerprint
        run: mise run smoke:fingerprint

      # A pull request run sees the evidence of main and of its own scope. Keep the path the same as
      # in smoke.yml: the cache version includes it.
      - name: Look up the smoke evidence
        id: evidence
        uses: actions/cache/restore@v6
        with:
          path: .smoke-evidence
          key: smoke-evidence-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          EVIDENCE: ${{ steps.evidence.outputs.cache-hit }}
        run: mise run release:plan

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.validate == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint, validate, test and build
        run: mise run check

      - name: Run the task script tests
        run: mise run test:scripts

      - name: Check that every version is ${{ needs.plan.outputs.version }}
        run: moonx scripts/versions.mbtx check ${{ needs.plan.outputs.version }}

  build-windows:
    name: Build (windows-x64)
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'

      - name: Update the registry
        run: moon update

      - name: Build smithy natively for Windows
        run: moon build apps/smithy --target native --release

      # Keep this version aligned with the Node pin in .config/mise/config.toml.
      - name: Install Node for Windows acquisition fixtures
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Test public and authenticated acquisition on Windows
        run: moonx scripts/test-public-http.mbtx native js

      - name: Test CLI behavior on Windows
        run: moonx scripts/test-cli.mbtx native js

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/native/release/build/moonrockz/smithy-cli/smithy-cli.exe
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [plan, build-windows]
    if: needs.plan.outputs.build == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the windows-x64 executable
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/cross/windows-x64/native/release/build/moonrockz/smithy-cli

      - name: Build the release outputs into dist/
        run: mise run build:release

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke
    needs: [plan, build]
    uses: ./.github/workflows/smoke.yml
    permissions:
      contents: read
      issues: write
    with:
      version: ${{ needs.plan.outputs.version }}
      fingerprint: ${{ needs.plan.outputs.fingerprint }}
      record: ${{ needs.plan.outputs.record == 'true' }}
      report-failure: ${{ github.event_name == 'schedule' }}

  publish:
    name: Publish to mooncakes.io
    runs-on: ubuntu-latest
    needs: [plan, validate, smoke]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the mooncakes.io credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials

      - name: Publish the modules
        run: mise run release:publish

      - name: Run the published CLI with moonx
        run: mise run release:verify-cli -- ${{ needs.plan.outputs.version }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Write the release notes
        run: mise run release:notes ${{ needs.plan.outputs.version }} > "$RUNNER_TEMP/notes.md"

      - name: Create the release or upload the missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:github ${{ needs.plan.outputs.version }}
