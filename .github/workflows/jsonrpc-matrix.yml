name: JSON-RPC interoperability matrix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  matrix:
    name: All 27 language and transport combinations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v6

      - name: Install the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Go runtime embedding
        run: mise run jsonrpc:go:runtime -- --check

      - name: Check Go generated golden files
        run: mise run codegen:go -- --check

      - name: Check MoonBit and Python runtime embedding
        run: mise run runtime:embed:check

      - name: Check MoonBit and Python generated golden files
        run: mise run codegen:payment-terminal -- --check

      - name: Check the MoonBit runtime
        run: mise run test:runtime:moonbit

      - name: Check the Python runtime
        run: mise run test:runtime:python

      - name: Check the generated MoonBit peers
        run: mise run test:generated:moonbit

      - name: Check the generated Python peers
        run: mise run test:generated:python

      - name: Build the MoonBit sample once
        run: mise run sample:build:moonbit

      - name: Build the Python sample once
        run: mise run sample:build:python

      - name: Build the Go sample once
        run: mise run sample:build:go

      - name: Run the Go quality gates
        run: mise run test:jsonrpc:go

      - name: Run all 27 pairs and check each scenario transcript
        run: mise run test:jsonrpc:matrix

      - name: Write the pass and fail table
        if: always()
        run: mise run test:jsonrpc:matrix -- --summary

      - name: Retain transcripts, checks and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonrpc-matrix-${{ github.sha }}
          path: .dev/out/jsonrpc-matrix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  windows:
    name: MoonBit and Python peers on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v6

      # Use the same native setup as release.yml. Cross-built Windows
      # programs resolve core's platform from the host and read arguments wrongly.
      - name: Install the pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'

      # Keep this version aligned with the uv pin in .config/mise/config.toml.
      # runtime-python.mbtx stops when uv --version differs from that pin.
      # uv installs the Python of .python-version and the locked dependencies.
      - name: Install the pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Update the registry
        run: moon update

      - name: Check the MoonBit runtime
        timeout-minutes: 5
        run: moonx scripts/runtime-moonbit.mbtx test

      - name: Check the generated MoonBit peers
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: moonx scripts/runtime-moonbit.mbtx generated

      - name: Build the MoonBit sample once on Windows
        id: moonbit_sample
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: moonx scripts/runtime-moonbit.mbtx sample-build

      - name: Check the Python runtime
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: moonx scripts/runtime-python.mbtx test

      - name: Check the generated Python peers
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: moonx scripts/runtime-python.mbtx generated

      - name: Build the Python sample once on Windows
        id: python_sample
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: moonx scripts/runtime-python.mbtx sample-build

      # Twelve combinations: each MoonBit and Python caller and receiver over
      # stdio, HTTP and WebSocket, each with all four scenarios.
      - name: Run all four scenarios for MoonBit and Python over every transport
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.moonbit_sample.outcome == 'success' && steps.python_sample.outcome == 'success' }}
        run: moonx scripts/jsonrpc-matrix.mbtx --caller moonbit,python --receiver moonbit,python

      # The Python sample failed, so the job fails. Still collect the
      # MoonBit-to-MoonBit evidence.
      - name: Run all four scenarios for MoonBit only
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.moonbit_sample.outcome == 'success' && steps.python_sample.outcome != 'success' }}
        run: moonx scripts/jsonrpc-matrix.mbtx --caller moonbit --receiver moonbit

      - name: Write the Windows pass and fail table
        if: always()
        run: moonx scripts/jsonrpc-matrix.mbtx --summary

      - name: Retain Windows transcripts, checks and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonrpc-matrix-windows-${{ github.sha }}
          path: .dev/out/jsonrpc-matrix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
