# Site: build both channels of the Pages site, check the links of each, and deploy.
#
# Each channel is a full build of its own checkout (scripts/site-pages.mbtx):
#   /smithy/       the release channel, built from the newest stable tag when that tag contains
#                  site/moon.mod. Until a tag does, it is main with channel next and the "unreleased" banner.
#   /smithy/next/  main, always.
# A pull request builds and checks only. It never uploads or deploys.
#
# Deploy runs on a push to main, a manual run and a call from release.yml, never on a pull request.
# release.yml creates the tag with GITHUB_TOKEN, and a tag push from that token starts no workflow, so
# release.yml calls this workflow after the release. A failed deploy shows on the commit. This workflow
# is not part of ci-ok.
#
# The repository needs Settings > Pages > Source "GitHub Actions". No workflow changes that setting.
#
# After the build, the browser tests (site/tests/browser) load the playground of both channels in
# Lightpanda and, for the checks that Lightpanda cannot run, in Playwright's Chromium. Lightpanda has no
# Windows build, so this workflow runs on Linux only.

name: Site

on:
  pull_request:
    paths:
      - site/**
      - docs/**
      - examples/**
      - apps/smithy/README.md
      - pkgs/**/README.mbt.md
      - scripts/site-*.mbtx
      - .github/workflows/site.yml
      - .config/mise/config.toml
      - .github/actions/setup/**
      - pkgs/artifact-resources/**
      - pkgs/jmespath/**
      - pkgs/smithy-syntax/**
      - pkgs/smithy/**
      - pkgs/smithy-validation/**
      - pkgs/smithy-jsonschema/**
      - pkgs/smithy-openapi/**
      - pkgs/smithy-openrpc/**
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - examples/**
      - apps/smithy/README.md
      - pkgs/**/README.mbt.md
      - scripts/site-*.mbtx
      - .github/workflows/site.yml
      - .config/mise/config.toml
      - .github/actions/setup/**
      - pkgs/artifact-resources/**
      - pkgs/jmespath/**
      - pkgs/smithy-syntax/**
      - pkgs/smithy/**
      - pkgs/smithy-validation/**
      - pkgs/smithy-jsonschema/**
      - pkgs/smithy-openapi/**
      - pkgs/smithy-openrpc/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  build:
    name: Build and check both channels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds that deploy run one at a time, and each one checks out main when it starts. A build therefore
    # never finishes before an older one, so an older artifact cannot deploy after a newer one. A newer
    # pending build replaces an older pending build, which would build the same or older content. This
    # includes a pending call from release.yml: the newer build then deploys the new tag.
    # A pull request uses a group of its own and cancels its superseded build.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages-build' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # A pull request builds its own merge commit. Every other run builds main.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # bun and Lightpanda are pinned in site/mise.toml, so only this workflow installs them. mise reads that
      # file in site/; the site scripts run bun and Lightpanda there. The file must be trusted before any
      # mise shim runs in site/.
      - name: Install the site's tools
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust
          mise install

      - name: Install warren
        run: moon install moonbit-community/warren@0.4.5

      # CodeMirror for the playground bundle and Playwright for the browser tests, as site/bun.lock pins them.
      - name: Install the site's npm packages
        working-directory: site
        run: bun install --frozen-lockfile

      # site/ is outside moon.work, so ci.yml and `mise run check` skip it. --no-build: the next step builds.
      - name: Test the site packages
        run: moonx scripts/site-check.mbtx --no-build

      - name: Build both channels and check the links of each
        run: mise run site:pages -- --out _site

      # The Chromium of the pinned Playwright, for the checks that Lightpanda cannot run.
      - name: Install Playwright's Chromium
        working-directory: site
        run: bunx playwright install --with-deps chromium

      # Playwright starts the site server and Lightpanda (site/tests/browser/playwright.config.js).
      - name: Run the browser tests
        run: mise run site:test:browser

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
